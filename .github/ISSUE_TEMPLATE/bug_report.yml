name: Bug report
description: Report a reproducible problem in the bounded public alpha.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please use synthetic inputs and remove credentials, personal data, and private paths.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Include commands and a synthetic fixture when possible.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Quiet House version or commit
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version and operating system
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed secrets, personal data, customer data, and private local paths.
          required: true
