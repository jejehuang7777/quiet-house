[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quiet-house"
version = "0.1.0a1"
description = "Authority-aware routing and immutable receipts for synthetic agent work"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "pydantic>=2.0,<3",
  "strands-agents[ollama]>=1.53,<2",
]

[project.scripts]
quiet-house-smoke = "quiet_house_app.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
